# Fast concentrated-mode smoke: prove plumbing without a full research run.

mode: concentrated

paths:
  lake_dir: data/lake-smoke
  artifacts_dir: artifacts/smoke

universe:
  name: smoke
  benchmark: SPY
  min_history_days: 504
  max_tickers: 30

data:
  start: "2015-01-01"
  end: null
  min_dollar_volume: 1000000

features:
  momentum_windows: [5, 21, 63]
  vol_window: 21
  volume_window: 21
  ma_windows: [10, 50, 200]
  regime_ma: 200

costs:
  commission_bps: 1.0
  slippage_bps: 5.0
  stress_multiplier: 3.0

risk:
  max_weight_per_name: 0.35
  max_gross_exposure: 1.0
  drawdown_penalty: 0.08

training:
  train_years: 2.0
  test_months: 6
  embargo_days: 5
  total_timesteps: 20000
  seed: 42
  n_env_steps: 512
  learning_rate: 0.0003
  n_workers: 4

concentrated:
  max_names: 4
  min_gross_exposure: 0.80
  excess_reward_weight: 1.5
  absolute_reward_weight: 0.05
  learner: supervised
  train_cost_multiplier: 3.0
  turnover_penalty: 0.35
  baseline_mix: 0.45
  momentum_window: 63
  hold_deadband: 0.03
  sticky_rank_buffer: 2
  ensemble_max_members: 5

paper:
  starting_cash: 100000

referee:
  leakage_sample_dates: 10
  cheat_corr_threshold: 0.30
