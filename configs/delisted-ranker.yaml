# A second learner on the delisted point-in-time book.
# Artifacts go to artifacts/delisted-ranker/. The saved PPO is not writable
# from here, and this file is not the daily paper model.
#
# Fixed before the run:
# - Prices are the delisted file plus Lehman, WorldCom, Bear, and old GM,
#   with those three names' cash dividends in the return.
# - Each day the book may hold the 120 names that were already liquid as of
#   the prior close. Half of the book is not pinned to SPY.
# - Clues are the lagged price features plus lagged CPI inflation,
#   unemployment, and the T-bill minus inflation.
# - The learner is a shallow gradient-boosted tree, not PPO.
# - It trades once every 5 sessions. Costs stay at 1 bp commission and 10 bp
#   slippage.
# - The learned book is kept only if the stitched unseen years beat SPY and
#   at least half of those years finish ahead. Otherwise the deployed book
#   is SPY. The last 252 decision days are left out of that test.

mode: portfolio

paths:
  lake_dir: data/lake-yield-robust
  artifacts_dir: artifacts/delisted-ranker

universe:
  name: default
  benchmark: SPY
  min_history_days: 63
  max_tickers: 120

data:
  start: "2000-01-01"
  end: null
  min_dollar_volume: 5000000
  price_file: data/external/sp500_delisted_prices.csv

features:
  momentum_windows: [5, 21, 63, 126, 252]
  vol_window: 21
  volume_window: 21
  ma_windows: [10, 50, 200]
  regime_ma: 200
  include_macro: true

costs:
  commission_bps: 1.0
  slippage_bps: 10.0
  stress_multiplier: 3.0

risk:
  max_weight_per_name: 0.10
  max_gross_exposure: 1.0
  drawdown_penalty: 0.15

training:
  learner: ranker
  train_years: 6.0
  test_months: 12
  embargo_days: 10
  total_timesteps: 0
  seed: 42
  n_env_steps: 512
  learning_rate: 0.0003
  n_workers: 1

paper:
  starting_cash: 100000

referee:
  leakage_sample_dates: 12
  cheat_corr_threshold: 0.30

compete:
  enabled: true
  symbol: "^IRX"
  reward: both
  focus: market
  yield_weight: 0.20
  spy_beat_weight: 1.0
  observe_yield: true
  observe_curve: false
  cash_earns_yield: true
  replay_experience: false
  experience_timesteps: 0
  final_holdout_days: 252
  rebalance_interval: 5
  spy_anchor: 0.0
  repeated_edge: true
