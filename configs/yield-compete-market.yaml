# Market-focused copy. The bill is a light penalty, not the target.
# Artifacts go to artifacts/yield-compete-market/. The live champion is not writable.
#
# Fixed before this run:
# - Reward is log(after-cost wealth) minus log(SPY), minus 0.20 times the bill.
# - The agent also sees lagged 10-year and 5-year yields and the curve slope.
# - History starts in 1998, on a wider liquid universe.
# - Last 252 decision days stay sealed. Folds stop one embargo before that.
# - One model is trained on the years just in front of the seal and scored once,
#   then again at 3x costs. It is not refit after that score.
# - The 2025-11 to 2026-11 year was already scored under the old dual-hurdle
#   reward. This grade is a follow-up on that same calendar window.
# - Saved paper decisions are not replayed. They sit inside the seal.

mode: portfolio

paths:
  lake_dir: data/lake-yield-market
  artifacts_dir: artifacts/yield-compete-market

universe:
  name: market
  benchmark: SPY
  min_history_days: 756
  max_tickers: 70

data:
  start: "1998-01-01"
  end: null
  min_dollar_volume: 5000000

features:
  momentum_windows: [5, 21, 63, 126, 252]
  vol_window: 21
  volume_window: 21
  ma_windows: [10, 50, 200]
  regime_ma: 200

costs:
  commission_bps: 1.0
  slippage_bps: 10.0
  stress_multiplier: 3.0

risk:
  max_weight_per_name: 0.10
  max_gross_exposure: 1.0
  drawdown_penalty: 0.15

training:
  train_years: 6.0
  test_months: 12
  embargo_days: 10
  total_timesteps: 200000
  seed: 42
  n_env_steps: 2048
  learning_rate: 0.0003
  n_workers: 1

paper:
  starting_cash: 100000

referee:
  leakage_sample_dates: 12
  cheat_corr_threshold: 0.30

compete:
  enabled: true
  symbol: "^IRX"
  reward: both
  focus: market
  yield_weight: 0.20
  spy_beat_weight: 1.0
  observe_yield: true
  observe_curve: true
  cash_earns_yield: true
  replay_experience: false
  experience_timesteps: 0
  final_holdout_days: 252
