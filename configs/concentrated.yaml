# Concentrated mode — aggressive, fewer/fatter bets (full research run).
# Anti-timid: min invested, softer DD penalty, excess-vs-SPY-heavy reward.

mode: concentrated

paths:
  lake_dir: data/lake
  artifacts_dir: artifacts

universe:
  name: default
  benchmark: SPY
  min_history_days: 756
  max_tickers: 500

data:
  start: "2010-01-01"
  end: null
  min_dollar_volume: 5000000

features:
  momentum_windows: [5, 21, 63, 126]
  vol_window: 21
  volume_window: 21
  ma_windows: [10, 50, 200]
  regime_ma: 200

costs:
  commission_bps: 1.0
  slippage_bps: 5.0
  stress_multiplier: 3.0

risk:
  max_weight_per_name: 0.35      # fat bets allowed
  max_gross_exposure: 1.0
  drawdown_penalty: 0.08         # softer than v1 (was 0.25) — stop cash-hugging

training:
  train_years: 3.0
  test_months: 6
  embargo_days: 5
  total_timesteps: 150000
  seed: 42
  n_env_steps: 2048
  learning_rate: 0.0003
  n_workers: 4

concentrated:
  max_names: 6                   # keep at most this many holdings
  min_gross_exposure: 0.80       # must stay ≥80% invested (cash capped at 20%)
  excess_reward_weight: 1.5      # PPO path: lean hard on beating SPY
  absolute_reward_weight: 0.05   # PPO path: tiny "just survive" term
  learner: supervised            # supervised rank-then-size (or ppo)
  train_cost_multiplier: 3.0     # grade/train under harsh costs
  turnover_penalty: 0.35         # PPO-only churn tax
  baseline_mix: 0.45             # blend momentum prior into ranks
  momentum_window: 63            # dumb-but-strong baseline lookback

paper:
  starting_cash: 100000

referee:
  leakage_sample_dates: 20
  cheat_corr_threshold: 0.30
