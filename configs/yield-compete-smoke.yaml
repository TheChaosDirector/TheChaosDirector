# Short real-data run of the Treasury-competing copy.
# Own lake and own artifacts. Does not touch the live champion.

mode: portfolio

paths:
  lake_dir: data/lake-yield-smoke
  artifacts_dir: artifacts/yield-compete-smoke

universe:
  name: smoke
  benchmark: SPY
  min_history_days: 252
  max_tickers: 12

data:
  start: "2022-01-01"
  end: null
  min_dollar_volume: 1000000

features:
  momentum_windows: [5, 21, 63]
  vol_window: 21
  volume_window: 21
  ma_windows: [10, 50]
  regime_ma: 50

costs:
  commission_bps: 1.0
  slippage_bps: 5.0
  stress_multiplier: 3.0

risk:
  max_weight_per_name: 0.15
  max_gross_exposure: 1.0
  drawdown_penalty: 0.10

training:
  train_years: 2.0
  test_months: 12
  embargo_days: 5
  total_timesteps: 4096
  seed: 42
  n_env_steps: 512
  learning_rate: 0.0003
  n_workers: 2

paper:
  starting_cash: 100000

compete:
  enabled: true
  symbol: "^IRX"
  reward: excess
  observe_yield: true
  cash_earns_yield: true
  replay_experience: true
  experience_scale: 0.001
  min_coverage: 0.50
  holdout_frac: 0.25
  experience_timesteps: 512
